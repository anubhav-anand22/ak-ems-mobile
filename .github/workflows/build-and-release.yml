name: Expo EAS Local Build and Release

on:
  push:
    branches:
      - build

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Requires "packageManager": "pnpm@x.y.z" in package.json (otherwise add `with: version: 10`)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with EAS Local
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"'
        run: eas build --platform android --profile preview --local --non-interactive --output=./build-artifacts.tar.gz

      - name: Extract and Verify Release APKs
        run: |
          mkdir -p apks
          tar -xzf ./build-artifacts.tar.gz -C apks

          echo "Extracted APKs:"
          find apks -type f -name "*-release.apk"

          APK_COUNT=$(find apks -type f -name "*-release.apk" | wc -l)
          if [ "$APK_COUNT" -ne 3 ]; then
            echo "Expected 3 release APKs, found $APK_COUNT"
            exit 1
          fi

      - name: Extract Version & Find Single Latest Previous Release
        id: version_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ "$LATEST_TAG" = "$VERSION" ] || [ "$LATEST_TAG" = "v${VERSION}" ]; then
            LATEST_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty' 2>/dev/null || true)
          fi

          PREV_VERSION="${LATEST_TAG#v}"
          echo "PREV_TAG=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "PREV_VERSION=${PREV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${VERSION} | Latest previous tag: ${LATEST_TAG:-none}"

      - name: Download Previous Release APKs & Generate Per-ABI HDIFF Patches
        id: generate_patch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.version_info.outputs.PREV_TAG }}
          PREV_VERSION: ${{ steps.version_info.outputs.PREV_VERSION }}
        run: |
          mkdir -p prev-build patches hdiffpatch-bin

          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No previous release found. Releasing APKs without .hdiff patches."
            exit 0
          fi

          if ! gh release download "$PREV_TAG" -p "*-release.apk" -D prev-build/; then
            echo "::warning::Previous release $PREV_TAG has no *-release.apk files. Releasing APKs without .hdiff patches."
            exit 0
          fi

          # Download prebuilt Linux x64 hdiffz binary once from latest HDiffPatch release
          gh release download --repo sisong/HDiffPatch --pattern "*_bin_linux64.zip" -D hdiffpatch-bin/
          unzip -qo hdiffpatch-bin/*_bin_linux64.zip -d hdiffpatch-bin/

          HDIFF_BIN=$(find hdiffpatch-bin -type f -name "hdiffz" | head -n 1)
          if [ -z "$HDIFF_BIN" ]; then
            echo "::warning::hdiffz binary not found in archive. Releasing APKs without .hdiff patches."
            exit 1
          fi
          chmod +x "$HDIFF_BIN"

          GENERATED_COUNT=0
          while IFS= read -r NEW_APK; do
            APK_NAME=$(basename "$NEW_APK")
            OLD_APK="prev-build/$APK_NAME"

            if [ ! -f "$OLD_APK" ]; then
              echo "::warning::Previous release $PREV_TAG is missing $APK_NAME; skipping its patch."
              continue
            fi

            # e.g. app-arm64-v8a-release.apk -> arm64-v8a | app-universal-release.apk -> universal
            ABI="${APK_NAME#app-}"
            ABI="${ABI%-release.apk}"

            TMP_PATCH="patches/patch-${ABI}-${PREV_VERSION}.hdiff.tmp"
            OUT_PATCH="patches/patch-${ABI}-${PREV_VERSION}.hdiff"

            echo "Generating patch for ${ABI} (${APK_NAME})..."
            if "$HDIFF_BIN" -f "$OLD_APK" "$NEW_APK" "$TMP_PATCH" && [ -s "$TMP_PATCH" ]; then
              mv "$TMP_PATCH" "$OUT_PATCH"
              ls -lh "$OLD_APK" "$NEW_APK" "$OUT_PATCH"
              GENERATED_COUNT=$((GENERATED_COUNT + 1))
            else
              rm -f "$TMP_PATCH"
              echo "::warning::Failed to generate patch for ${ABI}. Continuing with remaining APKs."
            fi
          done < <(find apks -type f -name "*-release.apk" | sort)

          echo "Generated ${GENERATED_COUNT} .hdiff patch file(s)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version_info.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version_info.outputs.VERSION }} (Build ${{ github.run_number }})
          fail_on_unmatched_files: false
          files: |
            apks/**/*-release.apk
            patches/*.hdiff
          generate_release_notes: true
