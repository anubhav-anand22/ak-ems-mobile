appId: com.ak22git7488.akemsmobile.dev
---
- launchApp:
    clearState: false

# 1. Tap the three-dot menu button on the first expense item
- tapOn:
    id: "expense-item-menu-btn"

# 2. Select Edit from the dropdown menu
- tapOn:
    id: "menu-item-edit"

# 3. Update the Note field
- tapOn:
    id: "add-expense-note-input"
- eraseText: 50
- inputText: "Updated grocery budget note"

# 4. Hide keyboard and scroll to submit button
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "add-expense-submit-return-btn"
    direction: DOWN

# 5. Save changes and return to Home
- tapOn:
    id: "add-expense-submit-return-btn"

# 6. Verify Home screen displays updated details
- assertVisible:
    id: "index-screen-add-expense-fab-btn"
