appId: com.ak22git7488.akemsmobile.dev
---
- launchApp:
    clearState: false

# 1. Tap the Add Expense FAB button on the Home screen
- tapOn:
    id: "index-screen-add-expense-fab-btn"

# 2. Enter Amount
- tapOn:
    id: "add-expense-screen-amount-input"
- inputText: "250"

# 3. Enter Title
- tapOn:
    id: "add-expense-title-input"
- inputText: "Groceries"

# 4. Tap the Add Item to list button
- tapOn:
    id: "add-expense-add-item-btn"

# 5. Enter To / Vendor
- tapOn:
    id: "add-expense-tofrom-input"
- inputText: "Supermarket"

# 6. Enter Note
- tapOn:
    id: "add-expense-note-input"
- inputText: "Weekly grocery shopping"

# 7. Submit and return to Home screen
- tapOn:
    id: "add-expense-submit-return-btn"

# 8. Verify the new expense is visible on the Home screen
- assertVisible: "Supermarket"
- assertVisible: "Groceries"
