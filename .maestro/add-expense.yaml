appId: com.ak22git7488.akemsmobile.dev
---
- launchApp:
    clearState: false

# 1. Tap the Add Expense FAB button on the Home screen
- tapOn:
    id: "index-screen-add-expense-fab-btn"

# 2. Enter Amount
- tapOn:
    id: "add-expense-screen-amount-input"
- inputText: "250"

# 3. Enter Title
- tapOn:
    id: "add-expense-title-input"
- inputText: "Groceries"

# 4. Tap the Add Item to list button
- tapOn:
    id: "add-expense-add-item-btn"

# 5. Enter To / Vendor
- tapOn:
    id: "add-expense-tofrom-input"
- inputText: "Supermarket"

# 6. Hide keyboard so it does not occlude the Note field or intercept touches
- hideKeyboard

# 7. Enter Note
- tapOn:
    id: "add-expense-note-input"
- inputText: "Weekly grocery shopping"

# 8. Hide keyboard before scrolling to submit button
- hideKeyboard

# 9. Scroll to submit button and tap "Add & return"
- scrollUntilVisible:
    element:
      id: "add-expense-submit-return-btn"
    direction: DOWN
- tapOn:
    id: "add-expense-submit-return-btn"

# 10. Verify the new expense is visible on the Home screen
- assertVisible: "Supermarket"
